<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishShield AI - Threat Detected</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f13;
            --text-color: #f8f9fa;
            --danger-color: #ef4444;
            --danger-dark: #b91c1c;
            --danger-glow: rgba(239, 68, 68, 0.4);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(239, 68, 68, 0.05) 0%, transparent 50%);
        }

        .warning-container {
            max-width: 600px;
            width: 90%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--danger-glow);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .warning-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--danger-color), transparent);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 2px solid rgba(239, 68, 68, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            stroke: var(--danger-color);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 16px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .url-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--danger-dark);
            padding: 16px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 14px;
            color: var(--danger-color);
            word-break: break-all;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .url-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(239, 68, 68, 0.05) 10px,
                rgba(239, 68, 68, 0.05) 20px
            );
            pointer-events: none;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--danger-color);
            color: white;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
        }

        .btn-primary:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }

        .btn-secondary {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #4b5563;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: #6b7280;
        }

        .threat-details {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: left;
            display: none;
        }

        .threat-details.visible {
            display: block;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .threat-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .threat-icon {
            color: var(--danger-color);
            margin-top: 2px;
        }

        .toggle-details {
            color: #9ca3af;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 16px;
            display: inline-block;
        }

        .toggle-details:hover {
            color: white;
        }
    </style>
</head>
<body>

    <div class="warning-container">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </div>
        
        <h1>Dangerous Website Blocked</h1>
        
        <p class="subtitle">PhishShield AI has prevented you from visiting this page because it exhibits characteristics of a phishing or malware site.</p>
        
        <div class="url-box" id="url-display">
            loading...
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="btn-back">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                Go Back to Safety (Recommended)
            </button>
            <button class="btn btn-secondary" id="btn-proceed">
                Proceed Anyway (Unsafe)
            </button>
        </div>

        <span class="toggle-details" id="toggle-details">View Threat Details</span>

        <div class="threat-details" id="threat-details">
            <h4 style="margin-bottom: 12px; color: #fff;">AI Detection Results:</h4>
            <div id="threat-list"></div>
        </div>
    </div>

    <script src="warning.js"></script>
</body>
</html>
